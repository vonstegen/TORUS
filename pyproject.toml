[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torus"
version = "0.2.0"
description = "Ternary Optimized Recursive Unified System - extreme-efficiency LLM inference via residual ternary planes, adaptive gating, and recursive context-as-variable handling."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Andrew Jochl", email = "ajoechl@pm.me"},
]
keywords = [
    "ternary",
    "quantization",
    "moe",
    "mixture-of-experts",
    "rlm",
    "recursive-language-models",
    "llm",
    "edge-ai",
    "1.58-bit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
test = ["pytest>=7.4"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/vonstegen/TORUS"
Issues = "https://github.com/vonstegen/TORUS/issues"

[tool.setuptools]
packages = [
    "torus",
    "torus.core",
    "torus.quant",
    "torus.moe",
    "torus.rlm",
]

[tool.setuptools.package-data]
torus = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
