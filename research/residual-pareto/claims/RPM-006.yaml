    transition: "-> UNTESTED"
    cause: "registered per RPM proposal acceptance. Asks whether there is a reproducible activation regime for learned residual information — scientifically interesting independently of whether T2 ultimately wins a Pareto tournament (RPM-001). Anchored by AF2/AF2-R/AF2-D empirical pattern."
