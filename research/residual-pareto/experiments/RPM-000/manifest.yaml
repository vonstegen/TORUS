# Experiment record - EXP-RPM-000 - Reference Lock & AF2-D Reproduction
# (formal G-RPM-0; preregistration gate before any RPM-D stage-1 work)
# Preregistered 2026-08-23 BEFORE any run under this ID. Thresholds frozen.
# Required by ROADMAP section "G-RPM-0" of the RPM proposal acceptance to
# establish the immutable foundation for the entire RPM program.
id: EXP-RPM-000
track: A
subtrack: "RPM reference lock + AF2-D reproduction"
tier: confirmation
claims_addressed: [RPM-001, RPM-002, RPM-003, RPM-004, RPM-005, RPM-006]
title: "G-RPM-0 reference lock: freeze AF2-D driver + env + reproduce both the damaged starting state and the trained T2 correction"
owner: "research-harness"
date_proposed: "2026-08-23"
status: PROPOSED
decision: null
grade: null

hypothesis: >
  The AF2-D driver SHA + frozen environment + frozen tokenizer +
  frozen model revision + frozen dataset revisions + frozen eval
  harness + frozen cost-vector schema (research/residual-pareto/COST-VECTOR-v1.yaml)
  together REPRODUCE both of AF2-D's headline measurements on
  Legion, within the preregistered tolerance band:

    (1) damaged starting state: post-damage, pre-train wikitext
        ppl lands in [400, 460] AND arc_easy in [0.45, 0.58]
        (the band already widened for the static-weight damage
        mode in AF2-D);

    (2) trained t2_ternary correction: post-train wikitext ppl
        lands within +/-2 standard deviations of the AF2-D
        reference value (20.96, mean seed-stderr 1.53 -> band
        [17.91, 24.01]) AND arc_easy and lambada_openai land
        within +/-2 standard deviations of their AF2-D reference
        values (arc 0.600 +/- 0.004 -> [0.592, 0.608]; lambada
        0.545 +/- 0.003 -> [0.539, 0.551]).

  Reproduction is a strict re-run: new run namespace under
  runs/r/RPM-000/<timestamp>/, fresh process on Legion, independent
  wikitext-103 token cache (sha256 captured by the auditator;
  identity vs AF2-D's cache is the expected outcome of a clean
  reproduction, NOT a violation), independently generated eval
  output.

rationale: >
  AF2-D produced the program's first PASS+ result on the
  architecture-vs-training-signal axis (trained T2 vs random T2
  on the damaged base, 25-227 sigma separation). The entire RPM
  program takes AF2-D as its empirical anchor: the damaged regime
  is the starting state of D5 in the Stage 1 sweep, and the
  trained T2 correction at ~20.96 ppl is the reference against
  which Stage 1 D5 results are compared.

  Without a formal reference-lock + reproduction, the RPM program
  could silently drift away from the phenomenon it is trying to
  map: a later change to the driver (a refactor, a dependency
  upgrade, a path change in the cost-vector schema) could shift
  the AF2-D reference value, invalidating Stage-1 comparisons
  built on it.

  EXP-RPM-000 is not a discovery experiment. It is the gate that
  must close before EXP-RPM-D1..D6 execute. The verdict will be
  "REPRODUCED" (PASS), "DRIFTED" (FAIL — fix and rerun), or
  "INVALID" (provenance contamination; rerun cleanly).

