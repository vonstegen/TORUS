id: EXP-RPM-DAMAGE-TYPE-001
title: "Stage 3 v1 \u2014 AF2-D damage-mechanism comparison at calibrated magnitudes (TWN vs Gaussian) \u2014 REVISED after Stage A calibration"
track: A
subtrack: Stage 3 v1 (AF2-D damage-mechanism mapping at matched damage magnitude)
tier: confirmation (with calibration phase)
status: PROPOSED
date_proposed: '2026-08-26T13:30:00Z'
date_revised: '2026-08-26T15:00:00Z'
owner: research harness
claims_addressed:
  - A-RP-LRN
  - A-RP-TSP
revision_note: >
  Initial manifest (2026-08-26T13:30:00Z) proposed target bands {small
  25-50, medium 150-300, large 500-900}. Stage A calibration probe
  (commit e425814, run 20260826T144024Z) measured actual damage
  magnitudes at the proposed parameter grid and revealed the bands do
  not match the empirical response surface. This revision replaces the
  fixed target bands with empirically-measured calibration points and
  preregisters the cross-mechanism comparison set based on actual data.
rationale: >
  Stage 2 v6/v7 (commits 75c20d3, 8fe04f0) established the AF2-D/TWN
  operating band reproduces across the full preregistered severity range
  {0.6, 0.7, 0.8, 0.9, 1.0} under TWN damage, with seeds {1, 2, 3, 4,
  5, 6}. The next scientific question is the DAMAGE-MECHANISM axis:
  P(learned residual signal matters | damage mechanism, layer, task,
  budget). The user's caveat (TWN thr=0.7 vs Gaussian \u03c3=1.0 are not
  inherently equivalent damage magnitudes) is empirically supported by
  Stage A: TWN thr=0.6 produces base ppl ~700 while Gaussian \u03c3=1.0
  produces base ppl ~15 (47x ratio). This experiment therefore separates
  mechanism effect from magnitude effect via a two-stage design where
  Stage A produces empirical parameter-to-magnitude mappings and Stage
  B performs the cross-mechanism comparison at the calibrated points.

  Stage A (CALIBRATION, COMPLETE): probe TWN thresholds and Gaussian
  sigmas at AF2-D. Empirical results at AF2-D (model.layers.0.mlp.down_proj):
  - TWN thr=0.3 \u2192 1524.80 ppl (fro_ratio=0.660)
  - TWN thr=0.5 \u2192 1524.80 ppl (fro_ratio=0.660)
  - TWN thr=0.7 \u2192 429.55 ppl (fro_ratio=0.603)
  - TWN thr=0.9 \u2192 203.60 ppl (fro_ratio=0.546)
  - TWN thr=1.0 \u2192 88.31 ppl (fro_ratio=0.518)
  - Gaussian \u03c3=0.5 \u2192 13.37 ppl (fro_ratio=1.118)
  - Gaussian \u03c3=1.0 \u2192 15.35 ppl (fro_ratio=1.414)
  - Gaussian \u03c3=2.0 \u2192 116.69 ppl (fro_ratio=2.236)
  - Gaussian \u03c3=3.0 \u2192 450.85 ppl (fro_ratio=3.164)
  - Gaussian \u03c3=5.0 \u2192 4889.07 ppl (fro_ratio=5.102)
  Calibration probe stored at runs/r/EXP-RPM-DAMAGE-TYPE-001/20260826T144024Z/stage_a_probe/

  Stage B (COMPARISON): at each calibrated (mechanism, magnitude) point,
  run the standard tournament (T2 vs random T2, T2 vs random LoRA, T2
  vs LoRA) to test whether LRN and TSP are preserved across damage
  mechanisms at matched magnitude. Cross-mechanism matches identified:
  - BAND-3 (matched within 5%): TWN thr=0.7 (430) vs Gaussian \u03c3=3.0 (451)
  - BAND-4 (matched within 3.2x): TWN thr=0.5 (1524) vs Gaussian \u03c3=5.0 (4889)
  - BAND-1 (Gaussian only, no TWN analog in range): Gaussian \u03c3=1.0 (15)
hypothesis: >
  At AF2-D layer (model.layers.0.mlp.down_proj), LRN and TSP operating
  bands preserve their qualitative structure across damage mechanisms
  TWN and Gaussian when damage magnitude is matched. Specifically, at
  BAND-3 (matched within 5% magnitude): trained T2 separates from
  random T2 by >=+2 sigma on >=2 of 3 capability metrics in BOTH
  mechanisms (LRN axis preserved), and trained T2 separates from random
  LoRA similarly (TSP axis preserved). Recovery ratios are comparable
  across mechanisms at matched magnitude (within 3x), supporting the
  broader interpretation that ternary residual correction has a general
  learned-recovery property.
frozen_axes_from_v6_v7_stage_a:
  site: model.layers.0.mlp.down_proj
  model: allenai/OLMo-1B-0724-hf
  tasks: wikitext,arc_easy,lambada_openai
  matched_storage_budget_bytes: 4194404
  eval_protocol: lm-eval-harness, batch_size=16, identical to v6/v7
  training_recipe:
    n_steps: 500
    batch_size: 4
    seq_len: 128
    lr: 1e-3
    momentum: 0.9
    grad_clip: 1.0
  arms_per_cell:
    trained:
      - damaged_base
      - t2_ternary
      - lora
    random_control_post_hoc:
      - random_t2_ternary
      - random_lora
  seeds: [1, 2, 3]
stage_a_calibration_completed:
  timestamp: '20260826T144024Z'
  artifact_path: 'runs/r/EXP-RPM-DAMAGE-TYPE-001/20260826T144024Z/stage_a_probe/'
  log: 'runs/r/_logs/stage3-v1-calibration/EXP-RPM-DAMAGE-TYPE-001_stage-a_20260826T144024Z.log'
  results: see_revision_note
stage_b_comparison:
  purpose: >
    Run full tournament at each calibrated (mechanism, magnitude) point
    and compare LRN/TSP z-scores across mechanisms at matched magnitude.
  calibrated_cells:
    - id: BAND-3-TWN
      mechanism: TWN
      threshold: 0.7
      expected_base_ppl: 430  # +-20% tolerance for seed-to-seed variance
    - id: BAND-3-Gaussian
      mechanism: Gaussian
      sigma: 3.0
      expected_base_ppl: 451
    - id: BAND-4-TWN
      mechanism: TWN
      threshold: 0.5
      expected_base_ppl: 1524  # Note: thr=0.3 and thr=0.5 both produce 1524
                                # at this layer; thr=0.5 selected for
                                # consistency with Stage 2 v2/v3/v4 TWN thr
    - id: BAND-4-Gaussian
      mechanism: Gaussian
      sigma: 5.0
      expected_base_ppl: 4889
    - id: BAND-1-Gaussian
      mechanism: Gaussian
      sigma: 1.0
      expected_base_ppl: 15
      note: 'No TWN analog in this magnitude range; TWN thr=1.0 produces 88 ppl.'
            This cell tests T2 behavior at near-pristine damage.
  cells: 5 calibrated cells \u00d7 4 arms \u00d7 3 seeds = 60 trained-arm cells;
        plus 5 calibrated cells \u00d7 1 base-eval \u00d7 3 seeds = 15 base cells;
        plus 5 calibrated cells \u00d7 2 random \u00d7 3 seeds = 30 random cells
        (post-hoc eval).
        Net: 105 cells.
  cost: ~5 hours (sequential, single GPU, ~3 min per trained arm cell)
  total_experiment_cost: ~5 hours (Stage B only; Stage A already complete)
cross_mechanism_criterion:
  BAND-3_match_primary:
    definition: >
      At BAND-3 (TWN thr=0.7 vs Gaussian \u03c3=3.0, base ppl 430 vs 451,
      matched within 5%), LRN is preserved iff trained T2 >=+2 sigma vs
      random T2 on >=2 of 3 capability metrics in BOTH mechanisms, no
      >=2 sigma regression on the third.
    LRN_preserved_in_both: PASS if both mechanisms satisfy criterion
    TSP_preserved_in_both: analogous for trained T2 vs random LoRA
  recovery_ratio_comparison:
    metric: signed_recovery_ratio = (random_T2_ppl - trained_T2_ppl) / random_T2_ppl
    criterion: >
      At BAND-3, the recovery ratio at TWN thr=0.7 is within 3x of the
      recovery ratio at Gaussian \u03c3=3.0. If comparable, the broader
      interpretation (general learned recovery) is supported at this
      magnitude. If the ratios differ by >10x, the narrow interpretation
      (T2 mechanism-specific) is supported at this magnitude.
  damage_magnitude_separation:
    criterion: >
      Within each cross-mechanism band (BAND-3, BAND-4), the post-damage
      base ppl must be within 3x between the TWN and Gaussian points.
      BAND-3 (430 vs 451): within 1.05x. PRIMARY MATCH.
      BAND-4 (1524 vs 4889): within 3.21x. SECONDARY MATCH.
  BAND-4_secondary_analysis:
    criterion: >
      At BAND-4 (3.2x magnitude mismatch), compare LRN presence but do
      not expect strict equivalence. If both mechanisms show LRN-positive
      with recovery ratios within 10x, the broader interpretation is
      supported under relaxed magnitude matching. If only one shows LRN,
      the result is mechanism-specific at this magnitude.
  BAND-1_control:
    criterion: >
      At BAND-1 (Gaussian \u03c3=1.0 only, near-pristine damage), report
      whether LRN/TSP are present. If absent (no significant separation),
      this is a CONTROL showing T2 doesn't help at near-pristine damage,
      supporting the interpretation that LRN is damage-driven.
expected_artifacts:
  - "runs/r/EXP-RPM-DAMAGE-TYPE-001/{timestamp}/stage_b_tournament/{calibrated_cell_id}/seed-{n}/{arm}/eval.summary.json"
  - "research/residual-pareto/experiments/EXP-RPM-DAMAGE-TYPE-001/calibration_table.md"
  - "research/residual-pareto/experiments/EXP-RPM-DAMAGE-TYPE-001/verdict.md"
kill_criteria: >
  Any cell whose matched-bytes test fails (deviation > +/-1% from
  4.19 MB preregistered) is INVALID; rerun cleanly.
  Any calibrated cell whose actual base ppl deviates >50% from the
  expected value (430, 451, 1524, 4889, 15) is excluded from cross-
  mechanism comparison; rerun Stage A probe if the deviation pattern
  suggests the layer's weight distribution has changed.
falsification_targets:
  - Hypothesis (LRN/TSP preserved across mechanisms at BAND-3) is
    FALSIFIED if LRN or TSP is preserved in one BAND-3 mechanism but
    not the other. The BAND-3 result is the primary outcome.
  - The narrow interpretation (T2 mechanism-specific to TWN) is
    supported if Gaussian damage produces LRN absent or inverted at
    BAND-3.
  - The broader interpretation (general learned recovery) is supported
    if LRN/TSP magnitude is comparable across mechanisms at BAND-3
    (within 3x ratio).
  - The damage-magnitude boundary hypothesis is supported if BAND-1
    shows no LRN (T2 doesn't help when damage is small).
