supersedes: []
next_permitted_experiment: >
  If mechanism effect dominates at BAND-3 (T2 fails at Gaussian but works
  at TWN at matched magnitude): the operating band is mechanism-specific;
  the Track B gating question is now P(T2 helps | damage mechanism) and
  the next experiment should explore WHICH damage mechanisms admit
  LRN-positive bands.
  If magnitude effect dominates (T2 works at BAND-3 in both mechanisms,
  fails at BAND-1 in both): the operating band is magnitude-bounded,
  mechanism-agnostic; the next experiment should map the LRN boundary
  in damage MAGNITUDE.
  If both effects are comparable at BAND-3 (LRN/TSP preserved at matched
  magnitude across mechanisms): the operating band is broad; the next
  experiment can move toward Track B conditional modeling.
blocking: []
unlock_rules_affected:
  - "Track B adaptive precision gating depends on whether the operating
    band is mechanism-specific or mechanism-agnostic. This experiment
    resolves that question."