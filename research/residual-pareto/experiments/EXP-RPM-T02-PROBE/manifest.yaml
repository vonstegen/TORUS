  justification: "Required to execute the preregistered probe; no
    torus/ core, AF machinery, or eval_lm.py changes."
  approved_by: "harness rule (OPERATING-PLAN section 1) + user
    steering 2026-08-30 chain (capability-damaging AF5 after CAL)."
