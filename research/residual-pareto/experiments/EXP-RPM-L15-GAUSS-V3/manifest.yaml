    - 2
    - 3
  n_steps: 500
  batch_size: 4
  seq_len: 128
  lr: 0.001
  momentum: 0.9
  grad_clip: 1.0
  tasks: wikitext,arc_easy,lambada_openai
  damage_gaussian: true
  damage_sigma: 0.5
  damage_seed: 0
  pre_train_eval: true
  freeze_exception:
    scope: experiments/EXP-RPM-L15-GAUSS-V3 only
    driver_sha_before: '34aa581'
    driver_sha_after: '34aa581'
    rationale: 'No driver changes required. Stage 2 v2 Gaussian damage driver (commit 18e10ba) already supports arbitrary sigma; only the manifest values change.'
    approved_by: 'OPERATING-PLAN \u00a76 v2.3; Stage 2 v2 driver extension covers this scope'
supersedes: EXP-RPM-L15-GAUSS
next_permitted_experiment: >
  If sigma=0.50 yields a positive architecture-vs-training signal (T2
  trained \u226B random), proceed to Stage 2 v4 (EXP-RPM-L0-V-GAUSS-V3 at
  sigma=0.50) to test cross-layer-category generalization. If sigma=0.50
  does NOT yield a positive signal, escalate to sigma=1.00 (Stage 2 v5)
  or pivot the preregistered hypothesis.
blocking: []
falsification_targets:
