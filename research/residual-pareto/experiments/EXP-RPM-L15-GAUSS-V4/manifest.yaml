id: EXP-RPM-L15-GAUSS-V4
title: "Stage 2 v4 tournament \u2014 model.layers.15.mlp.down_proj @ sigma=1.0"
track: A
subtrack: Stage 2 v4 (Gaussian damage, highest sigma)
tier: discovery
status: PROPOSED
date_proposed: '2026-08-25T22:00:00Z'
owner: research harness
claims_addressed: []
rationale: >
  Stage 2 v2 (sigma=0.20) and Stage 2 v3 (sigma=0.50) both found trained
  T2 \u2248 random T2 at L15 down_proj under Gaussian damage, because the
  damage was too mild OR the mechanism (specific weight recovery) that
  drives the AF2-D TWN result does not translate to Gaussian noise. Stage
  2 v2 CAL pilot showed the L15 sigma\u2192ppl curve has 4 distinct
  reproducibility bands: sigma=0.00 ppl=13.09, sigma=0.20 ppl=13.20,
  sigma=0.50 ppl=13.75, sigma=1.00 ppl=16.58. Stage 2 v4 preregisters
  sigma=1.00 to test whether the architecture-vs-training signal
  emerges at the **highest preregistered damage level** (sigma=1.00 is
  the maximum sigma in the Stage 2 v2 CAL pilot's grid). At sigma=1.00
  the damage produces a ~3.5 ppl-unit increase from baseline; if
  trained T2 still cannot beat random T2 at this level, the
  architecture-vs-training signal is firmly Stage 1 / 1.5-specific
  (AF2-D TWN damage). Same layer category as Stage 2 v2 and v3 so the
  sigma effect is isolated from any layer effect.
hypothesis: >
  At L15 down_proj under Gaussian damage sigma=1.00 (CAL ppl=16.58), the
  trained-vs-random T2 architecture-vs-training signal emerges: trained
  T2 separates from random T2 by \u22652 sigma on at least one capability
  metric (wikitext, arc_easy, lambada_openai) across 3 seeds.
kill_criteria: >
  All 27 cells (9 arms x 3 seeds) must run to completion (no early kill).
  Stop rule: if any arm's matched-bytes test fails (deviation > +/-1%
  from the preregistered storage budget), the run is INVALID and must
  be rerun cleanly.
expected_artifacts:
  - "runs/r/EXP-RPM-L15-GAUSS-V4/{timestamp}/seed-{n}/{arm}/eval.summary.json (per-cell)"
  - "runs/r/EXP-RPM-L15-GAUSS-V4/{timestamp}/seed-{n}/{arm}/adapter.npz (per-cell)"
  - "runs/r/EXP-RPM-L15-GAUSS-V4/{timestamp}/seed-{n}/{arm}/cost.json (per-cell)"
  - "runs/r/EXP-RPM-L15-GAUSS-V4/{timestamp}/seed-{n}/{arm}/cost_vector.json (per-cell)"
  - "runs/r/EXP-RPM-L15-GAUSS-V4/{timestamp}/aggregate.json (per-site trained-vs-random)"
  - "runs/r/EXP-RPM-L15-GAUSS-V4/{timestamp}/ARTIFACTS.json (sha256 manifest)"
  - "runs/r/EXP-RPM-L15-GAUSS-V4/{timestamp}/per_arm/{arm}/eval_summary.json (post-hoc)"
  - "runs/r/EXP-RPM-L15-GAUSS-V4/{timestamp}/per_arm/{arm}/eval_full.json (post-hoc)"
artifact_paths: []
experiment:
  model: allenai/OLMo-1B-0724-hf
  target_module: model.layers.15.mlp.down_proj
  arms:
    - t2_ternary
    - int4_residual
    - int8_residual
    - lora
    - dense_adapter
    - random_t2_ternary
    - random_lora
  seeds:
    - 1
    - 2
    - 3
  n_steps: 500
  batch_size: 4
  seq_len: 128
  lr: 0.001
  momentum: 0.9
  grad_clip: 1.0
  tasks: wikitext,arc_easy,lambada_openai
  damage_gaussian: true
  damage_sigma: 1.0
  damage_seed: 0
  pre_train_eval: true
  freeze_exception:
    scope: experiments/EXP-RPM-L15-GAUSS-V4 only
    driver_sha_before: '34aa581'
    driver_sha_after: '34aa581'
    rationale: 'No driver changes required. Stage 2 v2 Gaussian damage driver (commit 18e10ba) already supports arbitrary sigma; only the manifest values change.'
    approved_by: 'OPERATING-PLAN \u00a76 v2.3; Stage 2 v2 driver extension covers this scope'
supersedes: EXP-RPM-L15-GAUSS-V3
next_permitted_experiment: >
  If sigma=1.00 yields a positive architecture-vs-training signal (T2
  trained \u226B random), the architecture-vs-training story generalizes
  to higher-damage regimes and Track B B1 prereq "layer generalization
  at sufficient damage" is satisfied (at L15). If sigma=1.00 does NOT
  yield a positive signal, the AF2-D TWN result is firmly
  Stage 1/1.5-specific and the remaining open Track B questions must
  be answered through a different mechanism (e.g., AF2-D + AF5
  task-relevant re-measurement).
blocking: []
falsification_targets:
  - Stage 2 v4 preregistration hypothesis: trained T2 separates from
    random T2 by >=2 sigma on >=1 capability metric.
  - Stage 2 v3 verdict's tentative alternative hypothesis (training
    signal might emerge at greater damage).
