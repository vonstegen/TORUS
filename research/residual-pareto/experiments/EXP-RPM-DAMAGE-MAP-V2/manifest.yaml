  justification: >
    Per OPERATING-PLAN.md §6 v2.3 (rev 2.2, 2026-08-22): freeze exceptions
    permitted when required to execute a registered experiment. Stage 3 v1
    finding (T2 is mechanism-specific to TWN damage vs anti-recovery under
    Gaussian damage at matched magnitude) cannot be extended to the full
    damage-mechanism envelope without testing other mechanisms.
    MagnitudePrune and Dropout are the natural next points along the
    'zero-out' damage subspace orthogonal to TWN's absmean-zero and
    Gaussian's signed-noise.
  approved_by: user
  approved_at: '2026-08-27T00:00:00Z'
