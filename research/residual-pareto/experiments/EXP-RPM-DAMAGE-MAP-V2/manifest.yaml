rationale: >
  Stage 3 v1 (commit 84a4dad) established that trained T2 has OPPOSITE
  effects under TWN vs Gaussian damage at matched magnitude (LRN z =
  +49σ at TWN thr=0.7 vs -156σ at Gaussian σ=3.0; BAND-3 magnitude
  matched). The Track B gating question — P(T2 helps | damage mechanism,
  layer, task, budget) — is now bounded to the {TWN, Gaussian} pair.
  This experiment adds two orthogonal damage mechanisms (MagnitudePrune
  per-row top-k, Dropout per-element mask) to map the full damage-
  mechanism envelope at AF2-D. The four mechanisms form a 2x2 grid:
  {TWN, MagnitudePrune} x {structured-by-magnitude, structured-by-group}
  and {Gaussian, Dropout} x {dense-signed, dense-zero}. Together they
  let Track B know where T2 helps vs hurts across the entire zero-vs-
  signed damage space.
hypothesis: >
  At AF2-D under matched damage magnitude (~ppl 430 baseline),
  trained T2 LRN z-score varies systematically across mechanisms in
  the order TWN > MagnitudePrune > Dropout > Gaussian. Specifically:
  - TWN: LRN strongly positive (~+50σ)
  - MagnitudePrune: LRN positive but smaller magnitude (~+10σ),
    because per-row magnitude-zero is also structured sparsity but
    not TWN-style
  - Dropout: LRN near zero (~0σ), because per-element zeroing has
    no magnitude structure
  - Gaussian: LRN strongly negative (~-150σ), because signed dense
    noise is the worst case
  This order is the "structure-magnitude ranking" hypothesis: T2 helps
  insofar as the damage preserves a magnitude-asymmetric zero pattern.
  CONFIRMED structure helps more than no structure; CONFIRMED signed
  noise is worse than zero noise; UNCONFIRMED the exact magnitudes.

kill_criteria:
  - If ANY of the four mechanisms produces LRN |z| < 1σ at BAND-3
    matched magnitude, the hypothesis cannot be ranked and must be
    reverted to a coarse 2x2 partition.
  - If MagnitudePrune and Dropout cannot be calibrated to ±20% of
    BAND-3 magnitude (~ppl 350-515), the experiment fails the
    calibration gate and only {TWN, Gaussian} data is reported.

thresholds_pass: >
  At BAND-3 magnitude-matched pair within each mechanism, LRN |z| > 1σ
  (steered in order TWN > MagPrune > Dropout > Gaussian OR TWN > Gaussian
  AND Dropout > Gaussian; the order within {MagPrune, Dropout} is the
  contribution of v2 and may be either way).

thresholds_fail: >
  LRN sign on any mechanism fails to track with mechanism structure
  (e.g., Dropout recovers while Gaussian anti-recovers), OR calibration
  cannot match magnitudes to ±20%, OR TWN's recovered ppl fails to
  reproduce within ±2σ of v1's 17.74 baseline (the v1 reproducibility gate).

