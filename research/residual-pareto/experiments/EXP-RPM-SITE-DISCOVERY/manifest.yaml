    examples/site_discovery_summary.py + CLI, tests."
  justification: "Required to execute the preregistered discovery
    sweep; no torus/ core or AF machinery changes."
  approved_by: "harness rule (OPERATING-PLAN section 1) + user
    steering 2026-08-30 (CAL-first second-site discovery)."
