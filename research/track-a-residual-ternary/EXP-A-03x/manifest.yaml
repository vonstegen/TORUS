# ----- freeze exception logged here (OPERATING-PLAN §3, §6) ---------------
freeze_exception:
  change: >
    examples/distill_run.py: `run_one` only constructed the
    HFTeacherAdapter when `teacher_model_name != model_name`; the
    default self-distillation path (no --teacher-model) left `teacher`
    unbound and crashed with UnboundLocalError before the first
    training step. The teacher is now always constructed, defaulting
    to the same base model with target_modules=() (pure FP16, no
    quantization) — which is exactly the T1+T2 stack this experiment
    specifies: student = base + T2 correction plane(s), teacher =
    frozen FP16 base.
  justification: >
    Required to execute this preregistered A3 experiment: the
    T1+T2 sequential-correction pipeline cannot run at all without a
    teacher. No new quantization algorithm or loss is introduced;
    the fix only makes the default path construct the teacher the
    experiment design already assumed.
  approved_by: "harness rule: feature work permitted when required to execute a registered experiment (OPERATING-PLAN §3)"
supersedes: null
