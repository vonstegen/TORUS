id: A-RP-001
claim_version: 1
track: A
title: "T2 adds useful capacity beyond equal training time"
statement: "A second sequentially trained ternary correction plane provides useful model capacity beyond the benefit of equivalent additional training time."
quantitative_thresholds:
  - "PASS: Q(T1+T2) exceeds Q(T1 continued, matched budget) by >2 standard errors on at least one capability metric (ARC-E, LAMBADA, or the registered held-out task), with no regression beyond 1 standard error on the others."
  - "FAIL: no capability metric separates the arms by >2 standard errors, or the T1-continuation arm wins any capability metric by >2 standard errors."
date_registered: "2026-08-22"
state: PROVISIONAL_FAIL
reproduction: REQUIRED
required_evidence: [AF1, AF3, AF5, AF8]
supporting_experiments:
  - id: EXP-A-010
    decision: CONTINUE
    effect: "Discovery-tier KL progression 3.42→2.66→1.72→1.60 suggests capacity gain; proxy-only, provenance-limited, no equal-budget control. Motivates, does not confirm."
  - id: EXP-A-03x
    decision: PASS
    effect: "Discovery-tier T1+T2 pipeline confirmation on the worst-tolerance layer (model.layers.0.mlp.down_proj): trained T2 recovers wikitext ppl 427.71→41.44 and arc_easy 0.5396→0.6313 vs the untrained PTQ arm; KL 1.51→0.07 monotone. Both metric classes, clean provenance. No equal-budget T1-continuation control — does not confirm or deny the claim; satisfies the CP1.2 precondition for AF1."
unlock_rules_affected: ["Track B oracle gating (B1)"]
history:
  - date: "2026-08-22"
    transition: "-> UNTESTED"
    cause: "registered per 10-RESIDUAL-PLANE-FALSIFICATION-SUITE-V2"
  - date: "2026-08-22"
    transition: "UNTESTED -> TESTING"
  - date: "2026-08-22"
    transition: "TESTING -> PROVISIONAL_FAIL / REPRODUCTION_REQUIRED"
    cause: "EXP-AF-001 (AF1 equal-training-budget control, git 39be76c, n=3 seeds, matched CE under identical batches/optimizer/budget) PASS-FAIL inconclusive on the positive side, decisively wrong on the negative: T1+T2 loses to T1-continued on every capability metric (wikitext ppl +9.09 stderr in favor of A, arc_easy -2.23, lambada_openai -6.24). Strong evidence under the FAIL bar. v2.3 lifecycle: confirmation-tier ≥3-seed result with matched control can promote TESTING -> PROVISIONAL_FAIL in one step; REPRODUCTION_REQUIRED is set at the same transition; CONFIRMED_FAIL only after an AF8-style clean reproduction (EXP-AF-001-R, new namespace, frozen SHA, fresh process, independent token cache, independently generated eval output). Track B B1 stays locked under both possible outcomes."
conclusion: "Provisional FAIL under matched training-time budget at n=3 seeds, git 39be76c. Strong evidence against the claim as written — T1+T2 loses to T1-continued on every capability metric at matched CE. PENDING AF1-R reproduction (EXP-AF-001-R, AF8-style clean run) before CONFIRMED_FAIL. Track B B1 stays locked under both possible outcomes: even CONFIRMED_FAIL here does not preclude A-RP-002 (equal-storage) or A-RP-003 (sequential vs joint) from succeeding and motivating a revised B1 prerequisite wording. The v2 claim's wording confuses training-time and parameter-count as the cost axis; see OPERATING-PLAN §11 v2.3."
