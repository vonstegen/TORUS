title: "T2 competitive with equal-storage non-ternary correction [COMPOSITE — superseded by A-RP-TSP + A-RP-LRN decomposition]"
statement: "The improvement from T2 is competitive with an equal-storage non-ternary correction mechanism on the quality-per-physical-bit / quality-per-compute Pareto frontier. [STATUS NOTE (2026-08-25): this is a COMPOSITE claim. Mechanistic interpretation superseded by decomposition into A-RP-TSP (ternary structural prior) and A-RP-LRN (training adds value beyond the structural prior). See H-RPM-FRAMEWORK-PROPOSAL.md for evidence per axis. A-RP-002's CONFIRMED_PASS is preserved for auditability under the original composite definition; it should NOT be interpreted as proof that both underlying mechanisms passed. Track B gating now depends on A-RP-LRN, not A-RP-002.]"
quantitative_thresholds:
  - "PASS: at matched physical bytes (including scales and metadata), T2 is within 1 standard error of the best non-ternary control on the primary capability metric, or strictly better on quality-per-physical-bit."
  - "FAIL: any equal-storage non-ternary control beats T2 by >2 standard errors on the primary capability metric."
