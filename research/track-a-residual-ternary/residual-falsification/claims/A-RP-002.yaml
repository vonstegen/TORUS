id: A-RP-002
claim_version: 1
track: A
title: "T2 competitive with equal-storage non-ternary correction"
statement: "The improvement from T2 is competitive with an equal-storage non-ternary correction mechanism on the quality-per-physical-bit / quality-per-compute Pareto frontier."
quantitative_thresholds:
  - "PASS: at matched physical bytes (including scales and metadata), T2 is within 1 standard error of the best non-ternary control on the primary capability metric, or strictly better on quality-per-physical-bit."
  - "FAIL: any equal-storage non-ternary control beats T2 by >2 standard errors on the primary capability metric."
date_registered: "2026-08-22"
state: CONFIRMED
status: PASS
supporting_experiments:
  - id: EXP-A-03x
    decision: PASS
    effect: "Discovery-tier T1+T2 pipeline confirmation on the worst-tolerance layer (model.layers.0.mlp.down_proj): trained T2 recovers wikitext ppl 427.71->41.44 and arc_easy 0.5396->0.6313 vs the untrained PTQ arm; KL 1.51->0.07 monotone. Both metric classes, clean provenance. No equal-storage tournament control; does not test A-RP-002's matched-storage criterion."
  - id: EXP-AF-001
    decision: FAIL
    effect: "Equal-training-time control (arm A: full FP16 continued, arm B: T1+T2). T2 loses to continued FP16 on every capability metric. The FAIL closure of A-RP-001 is orthogonal to A-RP-002 (different cost axis: training-time, not storage)."
  - id: EXP-AF-002
    decision: PROVISIONAL_PASS
    effect: "Equal-storage tournament under OPERATING-PLAN §11 v2.3 cost-vector framing. T2 (4.2 MB) ties or dominates fp16 LoRA r=216 (4.4 MB) and fp16 dense_adapter r=192 (3.9 MB) within +/-2 stderr on every capability metric at n=3 seeds; lambada_openai +2.18 sigma in T2's favor (single-point measurement - within seed-noise). Untrained random_t2_ternary within noise of trained t2_ternary (median wikitext ppl delta 0.002, in noise)."
  - id: EXP-AF-002-D
    decision: PASS_PLUS
    effect: "Damaged-PTQ-start matched-storage tournament (run 20260823T092339Z, git 330e8b3, n=3 seeds). 21 runs total; all inside +/-1% bytes tolerance. PRE-TRAIN damage-mode verification: ppl=425.76 (in [400, 460] band), arc_easy=0.4891 (in [0.45, 0.58] band) - damage mode reproduces EXP-A-011 within +/-0.5% on ppl. CRITICAL DIAGNOSTIC (architecture-vs-training-signal): trained t2_ternary vs random_t2_ternary = -226.87 sigma (wikitext ppl, trained better), +25.08 sigma (arc_easy, trained better), +116.83 sigma (lambada_openai, trained better). PASS+ bar MET decisively on every metric - the architecture carries information in the damaged regime (the gap AF2/AF2-R found absent on the calibrated base). Trained t2_ternary recovers ppl 425.76 -> 20.96 (20.3x recovery; manifest PASS bar was 4.3x). Secondary finding: dense_adapter has the worst ppl (42.02) and largest seed-stderr (7.12) on the damaged base - dense_adapter's optimization is most sensitive to the damaged loss landscape. A-RP-002 stays CONFIRMED_PASS on the calibrated-base cost-vector axis (AF2/AF2-R); AF2-D refines the architecture's regime of dominance (damaged-PTQ regime, ppl > 100 starting state)."
  - id: EXP-AF-002-R
    decision: PASS
    effect: "AF8 clean reproduction of EXP-AF-002 (commit c036718, run 20260823T062845Z, n=3 seeds, matched deployed-bytes ~4.2 MB on model.layers.0.mlp.down_proj). 21 runs total; all inside +/-1% bytes tolerance. The PASS bar reproduces: t2 within +/-1.1 sigma of dense on every metric (mean wikitext (B-A)/se_diff = -1.125 sigma; arc_easy = -0.547 sigma; lambada = -0.551 sigma). Per-seed values reproduce within +/-2 sigma. Cost-vector byte counts byte-identical to AF2. The PASS+ bar (lambada +2.18 sigma dominance) does NOT reproduce: AF2's zero seed-variance on t2_ternary lambada was a single-point quirk; AF2-R reveals seed-variance ~0.001-0.004, putting the true lambada effect inside +/-1 sigma. Architecture-vs-training diagnostic unchanged: trained T2 ~ random T2 at N=500 on a calibrated FP16 base. Track B B1 unlock still requires AF5 task-relevant T2 above threshold (A-RP-002 CONFIRMED_PASS met; AF5 still required)."
unlock_rules_affected: ["Track B oracle gating (B1)"]
