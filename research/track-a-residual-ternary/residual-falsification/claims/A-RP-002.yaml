    transition: "PROVISIONAL_PASS -> CONFIRMED_PASS"
    cause: "EXP-AF-002 (AF2 equal-storage tournament, git 0529749, run 20260823T030918Z, n=3 seeds, matched deployed-bytes ~4.2 MB on model.layers.0.mlp.down_proj) DECIDED PROVISIONAL_PASS for A-RP-002 under the OPERATING-PLAN §11 v2.3 cost-vector framing. Trained t2_ternary (4,199,318 bytes) ties within +/-2 stderr of dense_adapter (3,932,771 bytes) on wikitext ppl and arc_easy, and dominates on lambada_openai by +2.18 stderr. lora r=216 (4,424,265 bytes) within +/-2 stderr of dense_adapter on every metric. int4_residual and int8_residual (column-masked to land matched bytes) substantially underperform, but the claim was about T2-vs-matched-storage-fp16 alternatives, not int-N. Untrained random_t2_ternary lands within noise of trained t2_ternary on every metric at N=500: on a calibrated FP16 base the ternary latent's contribution at this budget is not statistically distinguishable from random; the architecture is competitive, not dominating. Required next step: AF8-style clean reproduction (EXP-AF-002-R) before A-RP-002 -> CONFIRMED_PASS."
  - date: "2026-08-23"
    transition: "CONFIRMED_PASS -> CONFIRMED_PASS (refined by AF2-D)"
  - date: "2026-08-23"
    transition: "CONFIRMED_PASS -> CONFIRMED_PASS (refined by AF2-D)"
    cause: "EXP-AF-002-D (damaged-PTQ-start matched-storage tournament, git 330e8b3, run 20260823T092339Z, n=3 seeds) DECIDED PASS_PLUS on the architecture-vs-training-signal question: trained t2_ternary pulls ahead of random_t2_ternary by 25-227 sigma on every capability metric. The PASS+ bar that AF2/AF2-R found absent on the calibrated base manifests decisively on the damaged base. Trained t2_ternary recovers ppl 425.76 -> 20.96 (20.3x recovery). A-RP-002 stays CONFIRMED_PASS on the calibrated-base cost-vector axis (the AF2/AF2-R conclusion); AF2-D refines the architecture's regime of dominance (damaged-PTQ regime, ppl > 100 starting state). The claim's regime is now bounded: on a calibrated base T2 is Pareto-competitive-but-silent-vs-random; on a damaged base T2 pulls ahead of random by 25+ sigma. Track B B1 unlock rule: still requires AF5 task-relevant T2 above threshold. Driver bug fix also committed: T2TernaryAdapter.is_untrained now set in __init__ (was class-defaulted to False even when constructed with train=False; this caused AF2-R's aggregate.json to misclassify random_t2_ternary as trained - per-seed data was correct, only the audit classification was wrong)."
    cause: "EXP-AF-002-R (AF8 clean reproduction of AF2, commit c036718, run 20260823T062845Z, n=3 seeds, matched deployed-bytes ~4.2 MB on model.layers.0.mlp.down_proj) DECIDED PASS. The PASS direction reproduces: trained t2_ternary within +/-1.1 sigma of dense_adapter on every capability metric at n=3 (mean (B-A)/se_diff: wikitext -1.125 sigma; arc_easy -0.547 sigma; lambada -0.551 sigma). 21 runs total; all inside +/-1% bytes tolerance. Cost-vector byte counts byte-identical to AF2 (per arm × per seed). random_t2_ternary lands within noise of trained t2_ternary on every metric at N=500 (architecture-vs-training diagnostic unchanged). The PASS+ bar (lambada +2.18 sigma) does NOT reproduce: AF2's zero seed-variance on t2_ternary lambada was a single-point measurement; AF2-R reveals seed-variance ~0.001-0.004, putting the true effect inside +/-1 sigma. Architecture is Pareto-competitive with dense fp16 at matched bytes (PASS), but not pulling ahead on lambada by >2 sigma (PASS+ no longer holds). Track B B1 unlock rule: A-RP-002 CONFIRMED_PASS met; AF5 task-relevant T2 above threshold still required."
