    decision: PASS_PLUS
    effect: "Damaged-PTQ-start matched-storage tournament (run 20260823T092339Z, git 330e8b3, n=3 seeds). 21 runs total; all inside +/-1% bytes tolerance. PRE-TRAIN damage-mode verification: ppl=425.76 (in [400, 460] band), arc_easy=0.4891 (in [0.45, 0.58] band) - damage mode reproduces EXP-A-011 within +/-0.5% on ppl. CRITICAL DIAGNOSTIC (architecture-vs-training-signal): trained t2_ternary vs random_t2_ternary = -226.87 sigma (wikitext ppl, trained better), +25.08 sigma (arc_easy, trained better), +116.83 sigma (lambada_openai, trained better). PASS+ bar MET decisively on every metric - the architecture carries information in the damaged regime (the gap AF2/AF2-R found absent on the calibrated base). Trained t2_ternary recovers ppl 425.76 -> 20.96 (20.3x recovery). [INTERPRETATION NOTE: this evidence supports the LRN axis at AF2-D TWN damage, now A-RP-LRN.]"
  - id: EXP-AF-002-R
    decision: PASS
    effect: "AF8 clean reproduction of EXP-AF-002 (commit c036718, run 20260823T062845Z, n=3 seeds, matched deployed-bytes ~4.2 MB on model.layers.0.mlp.down_proj). 21 runs total; all inside +/-1% bytes tolerance. The PASS bar reproduces: t2 within +/-1.1 sigma of dense on every metric (mean wikitext (B-A)/se_diff = -1.125 sigma; arc_easy = -0.547 sigma; lambada = -0.551 sigma). Per-seed values reproduce within +/-2 sigma. Cost-vector byte counts byte-identical to AF2. Architecture-vs-training diagnostic unchanged: trained T2 ~ random T2 at N=500 on a calibrated FP16 base. [INTERPRETATION NOTE: this evidence supports the TSP axis at the calibrated base — T2 ties with non-ternary control, structurally competitive.]"
