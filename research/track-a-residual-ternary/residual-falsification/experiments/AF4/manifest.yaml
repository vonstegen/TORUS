artifacts_manifest: "runs/a/EXP-AF-004/<timestamp>/ARTIFACTS.json"
contamination_risks:
  - "Shared token cache: /tmp/wikitext103_train_ids.npy is read-only
    after first write; sha256 recorded. One writer (first run); later
    runs only read. Cache is shared with EXP-AF-001 by design (same
    stream, same sampler contract)."
  - "Each (arm, seed) reloads a fresh model instance; no cross-arm
    weight leakage. Arm seq's stage transition happens inside one
    process; the freeze invariant is asserted, not assumed."
  - "Eval leakage: eval tasks (wikitext test, arc_easy, lambada) are
    disjoint from wikitext-103 train."
  - "n_planes leakage: arm t1_only must never see the residual plane
    (driver sets n_planes=1 before its single stage and never touches
    it again; eval uses n_planes=1). Arms seq/joint evaluate at
    n_planes=2 via apply_eval_mode (eval weight = q_primary +
    q_residual), matching their deployed form."

# ----- freeze exception logged here (OPERATING-PLAN §3, §6) ---------------
freeze_exception:
  change: >
    (a) New examples/af4_sequential_vs_joint.py: three-arm curriculum
    driver reusing af1_budget_control's token cache, window sampler,
    CE loss, and shared train_arm loop (imported, not copied — the
    matched-budget contract stays literally one implementation). Adds
    the seq two-stage curriculum with the primary-freeze assertion,
    n_planes staging via HFStudentAdapter._current_n_planes, per-arm
    eval n_planes (1 for t1_only, 2 for seq/joint), and a generalized
    pairwise aggregate (seq_vs_joint primary; seq_vs_t1_only,
    joint_vs_t1_only secondary). (b) New tests
    (tests/test_af4_sequential_vs_joint.py) pinning: the seq staging
    freeze invariant and residual-only stage-2 movement on a synthetic
    STE, the n_planes forward switch semantics, per-arm parameter-set
    selection, and the pairwise aggregate z-score conventions.
  justification: >
    Required to execute this preregistered AF4 experiment: no existing
    driver can run a two-stage freeze curriculum at matched total
    budget (af1_budget_control trains one parameter set for one stage;
    distill_run.py's curriculum trains both planes jointly in stage 2,
    i.e. it cannot freeze T1). The driver reuses af1's control
    machinery so the matched-budget property remains a construction
    property. No trainer/adapter/quantizer changes: the two-plane
    torch STE and the runtime n_planes switch already exist
    (eac2c04).
  approved_by: "harness rule: feature work permitted when required to execute a registered experiment (OPERATING-PLAN §3)"

