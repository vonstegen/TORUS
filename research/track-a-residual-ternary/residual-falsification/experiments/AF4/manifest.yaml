# Experiment record — EXP-AF-004 — AF4 sequential-vs-joint training (confirmation tier)
# Preregistered 2026-08-28 BEFORE any run under this ID. Thresholds frozen.
id: EXP-AF-004
track: A
subtrack: "AF4 sequential-vs-joint curriculum control"
tier: confirmation
claims_addressed: [A-RP-003]
title: "Sequential freeze (T1 -> freeze -> T2) vs matched joint training of
  both correction-plane latents at equal total budget and equal deployed
  storage (model.layers.0.mlp.down_proj, OLMo-1B-0724-hf)"
owner: "research-harness"
date_proposed: "2026-08-28"
status: DECIDED
decision: FAIL
grade: A-

hypothesis: "At matched total training budget (1000 steps x batch 4 x
  seq 128 = 512k tokens, identical batches, identical SGD settings,
  identical next-token CE objective) and matched deployed storage (two
  ternary planes on model.layers.0.mlp.down_proj), the sequential
  curriculum (train the primary STE latent 500 steps at n_planes=1,
  freeze it, then train the residual STE latent 500 steps at
  n_planes=2) beats the joint curriculum (both latents trainable for
  1000 steps at n_planes=2 from step 0) by >2 standard errors on at
  least one capability metric, with no regression beyond 1 standard
  error on the others. This is A-RP-003's exact test (claim_version 1)."

rationale: "A-RP-003 is the last UNTESTED Track-A claim. The v2.3
  OPERATING-PLAN (§11) flagged the representation-versus-curriculum
  distinction as load-bearing: if sequential freezing is not materially
  superior to matched joint training, the program's T1 -> freeze -> T2
  recipe (EXP-A-03x; the curriculum default in examples/distill_run.py)
  is an implementation choice, not a mechanism, and a curriculum failure
  must not be allowed to invalidate the residual architecture (or vice
  versa: a recipe that only works under an unexamined curriculum
  assumption must not be promoted). EXP-A-03x established that the
  sequential pipeline trains and recovers this site (discovery, grade
  C, KD objective); EXP-AF-001 established the matched-CE equal-budget
  control design this experiment reuses. The suite doc (document 10,
  §7) arms 3 and 4 (T1 -> freeze -> T2 -> freeze -> T3 and T1 ->
  joint(T2,T3)) are excluded: routine T3/T4 scaling is locked by the
  unlock rules, the architecture supports at most two planes
  (TernarySTE), and 'where scientifically appropriate' does not justify
  a freeze exception for new plane-stacking architecture while cheaper
  diagnostics are open."

