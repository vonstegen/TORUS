result_summary: "9/9 runs complete (3 arms x 3 seeds); freeze invariant held on every seq run; no divergence; matched deployed bytes (seq = joint = 8,912,896). Claim test: joint beats seq on wikitext ppl (+5.20 stderr-of-difference; joint 21.44 +/- 0.20 vs seq 24.92 +/- 0.64) and lambada_openai (+21.88; joint 0.4684 vs seq 0.4432); arc_easy not separated (-0.90). FAIL clause 2 fires: A-RP-003 -> PROVISIONAL_FAIL, direction joint superior. Secondary context (not claim-bearing): t1_only dominates both two-plane arms on every metric (lambada +91.63/+104.40 stderrs vs joint/seq)."
confidence_and_reproduction: "Confirmation tier (n=3 seeds, preregistered thresholds, matched controls, machine-checked freeze invariant). High confidence within the tested regime (single site, single 1000-step budget, matched CE). REPRODUCTION_REQUIRED: EXP-AF-004-R (AF8-style clean reproduction of frozen SHA f1df165) before A-RP-003 -> CONFIRMED_FAIL."
next_permitted_experiment: "EXP-AF-004-R (clean reproduction, required); EXP-AF-003 (AF3 init robustness) and EXP-AF-006 (AF6 context robustness) remain open and unblocked."
experiments_blocked: ["none new — Track B stays locked by its existing §5 conditions; this verdict does not change A-RP-002/A-RP-LRN/A-RP-TSP"]
conclusion: "The sequential T1 -> freeze -> T2 curriculum is materially INFERIOR to matched joint training at this site under matched budget/storage/CE. A-RP-003 PROVISIONAL_FAIL; the mechanism claim (sequential freezing necessary or materially superior) is abandoned pending reproduction; sequential may be retained only if simpler. Verdict: experiments/AF4/verdict.md."
