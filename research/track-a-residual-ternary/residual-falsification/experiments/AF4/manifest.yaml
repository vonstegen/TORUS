controls:
  - "Arm joint is the preregistered control: identical model, data,
    order, optimizer settings, total steps, total tokens, deployed
    storage. Only the curriculum (which latents are trainable in which
    steps) differs."
  - "Data order matched by construction: every (arm, seed) pair samples
    from the same cached token stream with the same sampler seed and
    consumes exactly 1000 batches (pinned by
    tests/test_af4_sequential_vs_joint.py via the af1 sampler tests)."
  - "Freeze invariant: in arm seq the primary latent is bitwise
    identical before and after stage 2 (driver asserts torch.equal and
    the run is INVALID on violation; pinned by
    tests/test_af4_sequential_vs_joint.py)."
  - "Arm t1_only is the budget control: same total steps/tokens, one
    plane deployed. Its storage differs by construction (one plane, not
    two) and it is NOT part of the claim test — it answers the
    secondary question 'does the second plane add anything at matched
    budget in this regime?' (A-RP-001's question localized to this
    site; reported as context, never mixed into the A-RP-003 verdict)."

variants:
  - "arm seq: stage 1 = primary STE latent trainable, n_planes=1, 500
    steps; freeze primary; stage 2 = residual STE latent trainable,
    n_planes=2, 500 steps. Deploys 2 planes."
  - "arm joint: primary + residual STE latents both trainable,
    n_planes=2 from step 0, 1000 steps. Deploys 2 planes."
  - "arm t1_only: primary STE latent trainable, n_planes=1, 1000
    steps. Deploys 1 plane (budget control; storage differs by
    construction)."

objective_note: >
  All arms train with next-token cross-entropy on wikitext-103 train,
  the matched-CE choice established by EXP-AF-001 for this claim family
  (KD would inject a second, non-matched training signal; the claim is
  about the curriculum, so the objective is held fixed). The residual
  latent is initialized N(0, 0.01) per the repo default
  (HFStudentAdapter._attach_ste; the ternary dead zone at r=0 makes a
  zero init untrainable — see AF3 for the init-robustness question).
  All stages/arms use identical SGD settings (lr 1e-3, momentum 0.9,
  grad clip 1.0); no per-plane LR scaling (the claim is not about LR
  schedules).

dataset_and_samples: "wikitext-103 train split, tokenized once and
  cached (/tmp/wikitext103_train_ids.npy on legion, sha256 recorded in
  ARTIFACTS.json); random-window sampling, seed per run. Eval: FULL
  wikitext test, arc_easy, lambada_openai (no --limit; confirmation
  tier)."
seeds: [1, 2, 3]   # seed-001/002/003 sub-namespaces per v2 suite layout
metrics:
  - "capability: wikitext word_perplexity (lower better), arc_easy acc
    (higher better), lambada_openai acc (higher better) — full tasks,
