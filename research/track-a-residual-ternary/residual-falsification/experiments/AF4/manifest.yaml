evidence_categories: [representation, downstream]

# ----- PASS / FAIL / KILL thresholds (frozen at PROPOSE) ------------------
# Per A-RP-003 quantitative_thresholds (claims/A-RP-003.yaml, v1).
# Directions: ppl LOWER is better; acc HIGHER is better.
pass_thresholds:
  - "Q(seq) exceeds Q(joint) by >2 stderr-of-difference on at least one
    capability metric: (mean_joint - mean_seq) / se_diff > 2 for
    wikitext ppl, or (mean_seq - mean_joint) / se_diff > 2 for
    arc_easy or lambada_openai, where
    se_diff = sqrt(se_seq^2 + se_joint^2) over n=3 seeds."
  - "AND no regression beyond 1 stderr-of-difference on the other
    capability metrics (same formula, opposite direction)."

fail_thresholds:
  - "No capability metric separates seq from joint by >2
    stderr-of-difference in either direction (sequential is then
    retained only if simpler; the mechanism claim is abandoned)."
  - "OR joint beats seq by >2 stderr-of-difference on any capability
    metric (recorded as FAIL with direction 'joint superior' — the
    curriculum default must then be reconsidered as a follow-up, never
    edited in place)."

kill_criteria:
  - "Training diverges in any arm at any seed (loss = NaN or inf)."
  - "Any arm's post-train wikitext ppl is worse than the untrained PTQ
    reference 427.71 (training collapsed the site; rerun with a lower
    preregistered LR under a NEW experiment ID, never edited in
    place)."
  - "Freeze invariant violation: the primary latent moved during
    stage 2 of arm seq (run is INVALID)."
  - "Budget overrun: total wall clock exceeds 8 GPU-hours on legion."

budget: "8 GPU-hours total on legion. 9 train+eval runs (3 arms x 3
  seeds), estimated ~45-50 min each (1000 steps at ~1s + full 3-task
  eval at ~3-5 min), ~7 GPU-h total; two GPUs run (arm, seed) pairs in
  parallel (~4h wall). Confirmation tier cap: 8h."

stop_conditions:
  - "All 9 arm x seed runs complete with eval summaries and the
    aggregate.json is written."
  - "Kill criterion fires: record INVALID and stop."

