  - "New run namespace: runs/a/EXP-AF-004-R/<ts>/ inside a detached
    git worktree (~/TORUS-af4r) checked out at the frozen SHA — code
    identity is a construction property, and no reuse of AF4's
    namespace. One writer per namespace."
  - "Fresh Python processes on legion (nohup + disown; not forks of
    the AF4 driver processes)."
