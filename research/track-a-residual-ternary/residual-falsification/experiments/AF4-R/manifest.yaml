# ----- the reproduction acceptance rule (frozen; read before running) ------
# Per the user directive of 2026-08-28: the acceptance criterion is
# reproduction of the AF-004 DECISION under the frozen acceptance
# criteria, NOT bit-identity of aggregates. EXP-AF-001-R observed
# byte-identical per-seed values under a deterministic pipeline; if
# that occurs here it is recorded as a provenance observation
# (traceability notary) and nothing more.
reproduction_rule:
  REPRODUCED_iff_all:
    - "Run integrity: 9/9 (arm, seed) runs complete with eval
      summaries; freeze_check true on all 3 seq runs (primary latent
      bitwise identical across the stage boundary); no NaN/inf in any
      history record; deployed bytes per arm identical to AF4's
      recorded values (seq = joint = 8,912,896; t1_only = 4,456,448 —
      architecture constants, not stochastic)."
    - "Decision replay: the frozen AF4 acceptance formulas
      (experiments/AF4/manifest.yaml pass_thresholds /
      fail_thresholds), recomputed by the audit script from AF4-R
      per-seed values (NOT read from AF4-R's aggregate.json), return
      the AF4 verdict: FAIL with direction joint superior."
    - "Statistical agreement: for every arm x capability metric,
      |mean_R - mean_AF4| <= 2 * sqrt(se_R^2 + se_AF4^2), with means
      and stderrs recomputed from per-seed values on both sides."
  NOT_REPRODUCED_iff:
    - "Run integrity holds, but decision replay returns a different
      verdict, OR any arm x metric mean falls outside the ±2
      combined-stderr band. Effect: A-RP-003 reopens to TESTING; the
      AF4 verdict is retained as an unreproduced single result."
  INVALID_iff:
    - "Provenance uncertain (namespace/preexisting-path violation;
      independent cache content sha256 differs from AF4's recorded
      cache sha256 without a documented cause; code drift vs the
      frozen SHA on any executable path), OR a frozen kill criterion
      fires (divergence; freeze violation; post-train ppl worse than
      427.71). Effect: rerun cleanly under a new run ID; no claim
      state change."
  byte_identity_note: "Byte-identical per-seed values are neither
    required nor sufficient. They are recorded as a provenance
    observation only."

