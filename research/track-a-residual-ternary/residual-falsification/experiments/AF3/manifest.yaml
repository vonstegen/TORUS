# Experiment record — EXP-AF-003 — AF3 initialization robustness (confirmation tier)
# Preregistered 2026-08-28 BEFORE any run under this ID. Thresholds frozen.
id: EXP-AF-003
track: A
subtrack: "AF3 initialization robustness"
tier: confirmation
claims_addressed: []   # method-robustness classification; no live claim
                       # (A-RP-001 closed CONFIRMED_FAIL; AF3 was in its
                       # historical evidence list). Target recipe is the
                       # A-RP-002 CONFIRMED_PASS recipe (AF2-D t2_ternary).
title: "Residual-init sigma matrix {0, 1e-4, 3e-4, 1e-3, 3e-3, 1e-2} x
  seeds {11, 22, 33} on the AF2-D damaged-PTQ T2 recipe — robustness
  classification ROBUST / MODERATELY SENSITIVE / FRAGILE"
owner: "research-harness"
date_proposed: "2026-08-28"
status: PROPOSED
decision: null
grade: null

hypothesis: "The AF2-D T2 correction recipe (A-RP-002 CONFIRMED_PASS
  recipe: TWN-damaged frozen primary at model.layers.0.mlp.down_proj +
  trained ternary correction plane, 500 steps matched CE) recovers
  robustly across residual init scales, i.e. the recovery is not
  confined to a narrow sigma window. The experiment measures, it does
  not assume: the per-row absmax quantizer adapts its threshold to the
  latent scale (threshold = scale/3), so code ACTIVATION is
  scale-invariant while correction MAGNITUDE is not — whether 500
  steps at lr 1e-3 can grow a useful correction from sigma=1e-4 is an
  empirical question this matrix answers."

rationale: "Suite doc 10 §6 (AF3) and OPERATING-PLAN §7: a method that
  succeeds only in a narrow initialization window must receive a lower
  robustness assessment, and the classification attaches to any method
  whose success depends on initialization. User steering (2026-08-28):
  AF3 before AF6 — if the surviving A-RP-002 phenomenon is
  initialization-fragile, broader context testing (AF6) is less
  valuable; if it survives AF3, AF6 becomes much more informative.
  The matrix and seeds are verbatim from suite doc §6. The sigma=0
  cell is a structural control: at r=0 the adapter's scale clamps to
  1e-6 and every code is zero, so the correction starts ~12 orders of
  magnitude below useful magnitude — expected to fail, and its failure
  mode (slow-start vs hard-dead) is itself informative."

revision: ""              # filled at RUN — commit hash of the code
run_namespace: "runs/a/EXP-AF-003/<timestamp>/sigma-<sigma>/seed-0XX/t2_ternary/"
environment: "legion; x86_64; 2x TITAN RTX; env-lock.txt in run namespace"
baseline: "AF2-D t2_ternary at sigma=0.01 (EXP-AF-002-D, seeds 1-3:
  wikitext ppl 17.32-24.01 across runs, arc_easy ~0.60, lambada ~0.55;
  damaged-base pre-train ppl 425.76, arc_easy 0.4891, lambada ~0.026).
  AF3 repeats the sigma=0.01 condition at NEW seeds {11,22,33} — it is
  both a matrix level and a seed-robustness spot-check of the
  CONFIRMED_PASS recipe."

controls:
  - "Damage determinism: damage_target_module is a deterministic
    function of (group_size=128, threshold=0.7) with no seed input;
    the damaged base is identical across all 18 cells. Pre-train
    verification evals are therefore run ONCE per seed on the
    sigma=1e-2 invocation only (3 evals, band ppl [400, 460] per
    RPM-000/AF2-D); a band miss is INVALID (damage recipe drift)."
  - "Frozen recipe: the AF2-D driver path is unchanged except the
    --t2-init-sigma knob (freeze exception below). Deployed bytes are
    sigma-invariant by construction (packing depends on shape only);
    the audit verifies byte uniformity across cells."
  - "Data order matched by construction per seed (same cached token
    stream, same sampler seed) — cells at the same seed see identical
    batches."

variants:
  - "sigma in {0, 1e-4, 3e-4, 1e-3, 3e-3, 1e-2} x seeds {11, 22, 33}
    = 18 cells, each: --damage-ptq + trained t2_ternary arm,
    500 steps, batch 4, seq 128, lr 1e-3, momentum 0.9, grad clip 1.0,
    next-token CE on wikitext-103 train."

objective_note: "Identical to AF2-D (matched CE on wikitext-103). The
  only varied parameter is the latent init scale. Eval protocol
  identical to AF2-D (full wikitext test, arc_easy, lambada_openai;
  driver's float32 eval stance preserved for cross-experiment
  comparability)."

dataset_and_samples: "wikitext-103 train (cached token stream
  /tmp/wikitext103_train_ids.npy, sha256 recorded); full wikitext
  test, arc_easy, lambada_openai."
seeds: [11, 22, 33]   # per suite doc §6 (distinct from AF2-D's 1,2,3)
metrics:
  - "capability: wikitext word_perplexity (classification metric),
    arc_easy acc, lambada_openai acc (capability cross-check)"
  - "robustness statistics: per-level mean/std/min/max/failure rate,
    best/worst run, spread ratio (worst level mean ppl / best)"
  - "diagnostic-only: per-step training CE loss curves"
evidence_categories: [representation, downstream]

# ----- PASS / FAIL / classification thresholds (frozen at PROPOSE) --------
cell_success: "post-train wikitext ppl <= 100 (AF2-D's frozen recovery
  bar: 4.3x from the ~430 damage point)."
level_success: "all 3 seeds succeed at that sigma level."
classification_rules:
  ROBUST: "all 5 non-zero sigma levels succeed AND spread ratio <= 2."
  MODERATELY_SENSITIVE: ">= 3 of 5 non-zero levels succeed, OR (5/5
    succeed with spread ratio <= 5)."
  FRAGILE: "otherwise (< 3 of 5 levels succeed, OR spread ratio > 5,
    OR any level missing)."
zero_control: "sigma=0 is reported separately and excluded from the
  level counts. Expected to fail (near-dead start). If it SUCCEEDS,
  the near-dead-start model is falsified and that is recorded as a
  finding."
capability_crosscheck: "if a level succeeds on ppl while arc_easy or
  lambada means do not exceed the damaged base (0.4891 / ~0.026), the
  level is flagged PROXY IMPROVEMENT / CAPABILITY NOT VALIDATED and
  the flag is reported alongside the classification."
escalation_rule: "The classification annotates the A-RP-002
  CONFIRMED_PASS entry in the registry INDEX (ROBUST / MODERATELY
  SENSITIVE / FRAGILE note). It does NOT change A-RP-002's state:
  the CONFIRMED_PASS cells (sigma=0.01, seeds 1-3) are inside the
  tested matrix, and method-level fragility bounds generality, not
  the validity of the reproduced cells. Any stronger action (e.g. a
  new claim about the second plane's active harm, or demotion of the
  recipe's deployment recommendation) requires its own preregistered
  experiment."

kill_criteria:
  - "Training diverges in any cell (loss = NaN or inf): that cell is
    INVALID; if it recurs at a second seed for the same sigma, the
    run is INVALID."
  - "The sigma=1e-2 level fails at all 3 seeds (the CONFIRMED_PASS
    recipe itself failed at new seeds — environment or recipe drift;
    the run is INVALID and the drift is diagnosed before any rerun)."
  - "Pre-train verification misses the [400, 460] ppl band (damage
    recipe drift): INVALID."
  - "Deployed bytes differ across any two cells (packing is not
    sigma-invariant — a driver defect): INVALID."
  - "Budget overrun: total wall clock exceeds 4 GPU-hours."

budget: "4 GPU-hours cap on legion. 18 cells at ~6-8 min each
  (~2.2 GPU-h) + 3 pre-train verification evals; two GPUs run the
  sigma groups in parallel (~1.2h wall)."

stop_conditions:
  - "All 18 cells complete with eval summaries and the audit JSON is
    written."
  - "Kill criterion fires: record INVALID and stop."

expected_artifacts:
  - "per-cell: eval.summary.json, eval.full.json, history.jsonl,
    adapter.npz + meta, cost_vector.json"
  - "pre_train_eval.json (sigma=1e-2 invocation, one per seed)"
  - "audit.json (per-level statistics, classification, capability
    cross-check, integrity checks)"
  - "provenance.json + env-lock.txt + queue logs + ARTIFACTS.json"
artifact_paths: []
artifacts_manifest: "runs/a/EXP-AF-003/<timestamp>/ARTIFACTS.json"
contamination_risks:
  - "Shared token cache: /tmp/wikitext103_train_ids.npy is read-only;
    sha256 recorded."
  - "Each cell rebuilds a fresh model instance; no cross-cell weight
    leakage. Sigma groups write disjoint sigma-<sigma>/ namespaces
    under one run dir; the audit is the only cross-cell reader."
  - "The sigma=1e-2 invocation doubles as the pre-train verification
    pass; its cells are ordinary matrix cells (no special treatment
    in the classification)."

freeze_exception:
  change: "(a) T2TernaryAdapter gains init_sigma (default 0.01 — every
    pre-AF3 caller unchanged); build_site_adapter threads it into the
    trained t2_ternary arm only (untrained structure controls keep the
    frozen default); CLI flag --t2-init-sigma; the value is recorded
    in each cell's eval.summary.json. Deployed bytes are unaffected
    (adapter.npz packing depends on shape only; meta.json format
    unchanged). (b) New examples/audit_af3_robustness.py implementing
    the frozen classification rules + capability cross-check +
    integrity checks. (c) New tests
    (tests/test_af3_init_robustness.py) pinning the knob semantics
    (default unchanged, sigma=0 all-zero, threading into trained arm
    only) and the classifier boundaries."
  justification: "Required to execute this preregistered AF3
    experiment: the residual init scale was hard-coded at 0.01, so
    the suite-doc init matrix could not be run. The knob default is
    the frozen AF2-D value; no pre-AF3 result can shift."
  approved_by: "harness rule: feature work permitted when required to execute a registered experiment (OPERATING-PLAN §3)"

