  - "Concurrent writers: AF2-R writer is the only process touching
    runs/a/EXP-AF-002-R/. AF2 namespace is read-only after its
    DECIDE commit."
  - "Eval leakage: same disjointness as AF2 (eval tasks disjoint from
    wikitext-103 train)."
