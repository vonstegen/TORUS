  - "provenance.json + env-lock.txt + queue logs + ARTIFACTS.json"
artifact_paths: []
artifacts_manifest: "runs/a/EXP-AF-006/<timestamp>/ARTIFACTS.json"
contamination_risks:
  - "Token caches (wikitext train, owt train/test, wikitext test) are
    read-only after the prep step; shas recorded. The prep script
    refuses to overwrite."
  - "Each cell rebuilds a fresh model instance; regime namespaces are
    disjoint; the audit is the only cross-cell reader."
  - "owt train/test split is a single contiguous 99/1 split of shard
    0: train windows and test windows can never overlap by
    construction (the split point is a hard boundary)."

freeze_exception:
  change: "(a) examples/af6_data_prep.py: builds the openwebtext
    train/test and wikitext-103 test token caches (direct parquet
    download; sha-recorded; refuses to overwrite). (b) AF2 driver:
    corpus_perplexity() helper + --cross-eval-ppl-cache flag (records
    cache path/sha/windows + value in each cell's summary). No change
    to training, damage, adapter, packing, or the lm-eval ladder
    path. (c) New tests (tests/test_af6_context_robustness.py)
    pinning determinism, shift semantics (perfect model = 1.0,
    uniform model = vocab), the window contract, and the summary
    wiring."
  justification: "Required to execute this preregistered AF6
    experiment: no second corpus cache exists, and cross-corpus ppl
    has no lm-eval task. The new measurement is sanity-banded against
    the frozen ladder before any cell data is read."
  approved_by: "harness rule: feature work permitted when required to execute a registered experiment (OPERATING-PLAN §3)"

