# Claim record — A-RP-HAD — native Hadamard ternary training (Track A, subtrack A5)
id: A-RP-HAD
claim_version: 1
track: A
title: "Native Hadamard ternary training beats standard ternary training"
statement: "Building Hadamard-rotation geometry into ternary training from
  initialization (native rotated ternary parameterization) produces a
  preregistered downstream advantage over standard ternary training at
  matched architecture, data, optimizer, schedule, and budget on a
  small model."
quantitative_thresholds:
  - "At matched budget on a small model (100M-500M params), paired arms
    from the same random init: the rotated arm's wikitext ppl
    (lm-eval ladder instrument) must be <= 0.97 x the control arm's,
    AND arc_easy >= control - 0.03 AND lambada_openai >= control - 0.02
    (absolute). Any miss = FAIL."
  - "Parity gate (integrity): |step-0 loss difference| <= 0.1 nats and
    both finite; else INVALID."
  - "No kill criterion fired (divergence, live 15% loss-gap abort,
    budget overrun, environment drift)."
date_registered: "2026-08-29"
