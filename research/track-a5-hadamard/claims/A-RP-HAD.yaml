# Claim record — A-RP-HAD — native Hadamard ternary training (Track A, subtrack A5)
id: A-RP-HAD
claim_version: 1
track: A
title: "Native Hadamard ternary training beats standard ternary training"
statement: "Building Hadamard-rotation geometry into ternary training from
  initialization (native rotated ternary parameterization) produces a
  preregistered downstream advantage over standard ternary training at
  matched architecture, data, optimizer, schedule, and budget on a
  small model."
quantitative_thresholds:
  - "At matched budget on a small model (100M-500M params), paired arms
    from the same random init: the rotated arm's wikitext ppl
    (lm-eval ladder instrument) must be <= 0.97 x the control arm's,
    AND arc_easy >= control - 0.03 AND lambada_openai >= control - 0.02
    (absolute). Any miss = FAIL."
state: PROVISIONAL_FAIL
supporting_experiments:
  - id: "EXP-A-H1"
    decision: "FAIL (discovery, 2026-08-30)"
    effect: "H-NATIVE falsified at the tested site/budget/recipe:
      hadamard ppl ratio 1.045 (> 0.97 bar) despite better train
      loss (7.231 vs 7.280) and arc_easy (+0.017). Train/downstream
      disagreement recorded without rescue."
  - id: "EXP-A-H1 parity amendment"
    decision: "pre-run amendment (2026-08-30)"
    effect: "parity gate 0.1 -> 0.6 nats; pretrained PTQ base-gap
      0.492 measured pre-run and recorded as a covariate."
date_registered: "2026-08-29"
required_evidence:
  - "EXP-A-H1 (discovery, paired single seed) -> DISCOVERY PASS must
    escalate to confirmation: >=3 seeds + one clean reproduction
    before CONFIRMED_PASS (OPERATING-PLAN §3, CP3.2). A FAIL closes
    the Hadamard line with H-POST per CP3.2."
unlock_rules_affected:
  - "CP3.2 (Hadamard verdict): preregistered advantage without
    breaching kill criteria -> CONFIRMED_PASS after reproduction; else
    FAIL, the Hadamard line closes with H-POST."
  - "Large-model Hadamard runs stay locked until a small-model
    CONFIRMED_PASS (suite doc 10: 'Keep large-model Hadamard
    experiments locked until a small controlled native-Hadamard
    experiment earns a CONFIRMED_PASS')."
history:
  - date: "2026-08-29"
    transition: "UNTESTED -> TESTING"
    cause: "EXP-A-H1 preregistered (manifest
      research/track-a5-hadamard/EXP-A-H1/manifest.yaml, PROPOSE
      commit). Motivation chain: EXP-A-020 (H-POST FAIL),
      EXP-A-021 (H-NATIVE motivation CONTINUE), user steering
      2026-08-28 ordering native Hadamard as the primary next
      experiment after the A-F suite."
  - date: "2026-08-29"
    transition: "TESTING (run 1 INVALID, no state change)"
    cause: "EXP-A-H1 run 1 (runs/a/EXP-A-H1/20260829T201327Z)
      INVALID — driver/recipe defects caught pre-audit: (1) train()
      never saved its weights; the materialize process evaluated a
      fresh random model; (2) scale = mean|latent| per forward
      created a positive feedback that diverged both arms (8.8 ->
      10.4 loss). Fixed in the v2 recipe commit (learned per-linear
      scale, in-process materialize, 0.01-nat cross-check); frozen
      thresholds unchanged. Rerun under the same experiment ID,
      fresh timestamp."
  - date: "2026-08-29"
    transition: "TESTING (run 2 INVALID, no state change)"
    cause: "EXP-A-H1 run 2 (runs/a/EXP-A-H1/20260829T224005Z)
      INVALID — the STE passed ZERO gradient: ternary_codes used
      plain round().clamp() (zero derivative), so the ternary
      weights never trained; the loss drop came from scales +
      embeddings + biases, the code-flip rate was weight-decay
      noise, and the ladder measured a frozen-codes model. Caught
      by the conditioning proxy reading 0.0 + grad probe. Fixed in
      commit 4101ca0 (detach-trick STE + zero-gradient abort gate
      + identity-backward unit test); frozen thresholds unchanged.
      Also explains run 1's divergence."
  - date: "2026-08-30"
    transition: "TESTING -> PROVISIONAL_FAIL"
    cause: "EXP-A-H1 run 4 DECIDED FAIL (the first valid
      measurement; runs/a/EXP-A-H1/20260830T151743Z). The frozen
      primary bar missed: hadamard wikitext ppl 5,739.0 vs control
      5,491.9 (ratio 1.045 > 0.97) despite better train loss
      (7.231 vs 7.280; closed the 0.49-nat step-0 PTQ deficit) and
      better arc_easy (+0.017). Train/downstream disagreement
      recorded without rescue. Per CP3.2 the Hadamard line closes
      with H-POST. Verdict:
      research/track-a5-hadamard/EXP-A-H1/verdict.md."
conclusion: "H-NATIVE falsified at the tested site/budget/recipe
  (OPT-125M pretrained PTQ start, 512k tokens, AF recipe); the
  Hadamard line closes with H-POST per CP3.2. Reopening requires a
  NEW experiment ID with a preregistered account of the
  train/downstream disagreement."
