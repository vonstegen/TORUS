title: "EXP-A-H1. Ternary STE training of OPT-125M from its PRETRAINED
  weights with matched arms: standard ternary vs native rotated
  (Hadamard) ternary parameterization. Identical architecture/data/
  optimizer/schedule/budget; the rotation is the only axis."
owner: "research-harness"
status: PROPOSED
decision: null
grade: null

hypothesis: "A native Hadamard-rotated ternary parameterization (fixed
  Sylvester block rotations applied to each linear's input and output
  axes, ternary codes trained in the rotated domain) trains better
  than standard ternary training from the same PRETRAINED weights at
  matched budget: the rotated arm ends at least 3% lower wikitext
  ppl without material regression on arc_easy/lambada_openai, with
  the optimization-behavior diagnostics (loss trajectory, gradient
  conditioning, code-flip rate) recorded."

rationale: "Track A2 v2 (docs/TORUS-feedback/04) splits H-POST
  (post-hoc rotation+recovery: NO-SHIP at tested budget, EXP-A-020)
  from H-NATIVE (rotation geometry built into training from
  initialization OR SUFFICIENTLY EARLY TRAINING). EXP-A-021
  (retro-registered CONTINUE) observed better optimization
  behavior/conditioning for a rotated arm in controlled
  rotated-vs-unrotated training — the surviving hypothesis. A-H1 is
  the cheapest experiment capable of falsifying it: a paired
  single-seed discovery run (both arms from the same pretrained W0
  and data order — the rotation is the only difference), small model
  (OPT-125M, in the 100M-500M spec range), short budget. A failure
  closes the Hadamard line with H-POST per CP3.2; a discovery pass
  escalates to confirmation (>=3 seeds + clean reproduction) before
  any large-model Hadamard spend (suite doc 10).

  DESIGN REVISION (2026-08-30, pre-run): the from-scratch recipe was
  abandoned after three INVALID executions (see prior_runs) — the
  recipe became the experiment's subject instead of its substrate.
  The pretrained-start design below uses the AF-proven training
  recipe verbatim (the only stable ternary STE recipe established
  in this repo) so the rotation is isolated with a substrate that
  trains.

  Model choice: OPT-125M — nn.Linear throughout (the STE machinery
  attaches to linears), no RoPE (rotations stay within-head/within-
  block; no rotation-vs-positional-encoding interactions), learned
  position embeddings, 125M params, lm-eval compatible, GPT-2-style
  tokenizer. Pretrained weights: the experiment compares training
  GEOMETRY, not initialization quality.

  Rotation design: block-diagonal Sylvester H64 (2^6) on each
  linear's input (768 = 12x64; ffn 3072 = 48x64) and output axes;
  W = R_out^T Q R_in with ternary Q trained in the rotated domain.
  lm_head: input rotated, output (vocab, 50272) unrotated.
  Embeddings: fp16 in BOTH arms, unrotated. AF-proven quantization
  (torus.train.ste.ternary_quantize_ste_torch): per-group absmean
  scales (group 128), zero threshold 0.7, STE via the detach trick
  — both arms. Rotations are fixed constants derived from the dims
  (zero per-weight storage); both arms deploy identical physical
  bytes (packed ternary codes + per-group fp16 scales)."

revision: ""
baseline: "Paired control arm: standard ternary STE training of the
  same PRETRAINED OPT-125M weights with identical optimizer/schedule/
  data/budget. (Absolute references: OPT-125M FP16 ladder measured
  at run time as a covariate; the comparison is strictly arm-vs-arm.)"
controls:
  - "Paired design: both arms initialize from the SAME pretrained W0
    (control: W0 in the plain domain; hadamard: R_out W0 R_in in the
    rotated domain), consume the SAME token stream in the same
    order, run the identical AF recipe: SGD momentum 0.9, lr 1e-3,
    grad clip 1.0, seq 128, batch 4, 1000 steps, fp16 autocast,
    fp32 latent."
  - "Parity gate (integrity, pre-read): |step-0 loss difference|
    <= 0.6 nats and both finite. PRE-RUN AMENDMENT 2026-08-30: the
    original 0.1 was calibrated on random-init W0 (measured 0.044);
    the pretrained PTQ gap measures 0.492 (the H-POST admission
    penalty at step 0 — recorded as a covariate; the hadamard arm
    must close this deficit to pass the bars). The gate's purpose
    (catch pairing/instrument defects, the multi-nat class) is
    unchanged; a miss is INVALID."
  - "Control arm uses the plain ternary STE path; the hadamard arm
    differs ONLY by the rotation matrices and the domain of the
    ternary codes."
  - "Both arms materialize W_eff into the stock HF checkpoint for
    the eval ladder (eval_lm.py --mode baseline on a saved local
    path) — the runtime-rotated state dicts are also saved; the
    materialized form is fp16-dense for eval only, and deployed-bytes
    accounting uses the runtime (ternary Q + scales) form."
dataset_and_samples: "openwebtext (Skylion007) parquet shards 0-3,
  GPT-2/OPT tokenizer, concatenated token stream with a held-out 1%
  tail (test). Shard names + sha256 + token counts recorded in the
  data-prep manifest; caches refuse to overwrite. Both arms consume
  the identical stream from byte 0."
seeds: [7]   # discovery tier, paired arms; escalation requires >=3
metrics:
  - "capability (frozen ladder, eval_lm.py): wikitext ppl,
    arc_easy, lambada_openai — materialized-W_eff checkpoints"
  - "training diagnostics (reported, never decision): per-step CE
    loss, gradient conditioning proxy per linear
    (||g||_2 / ||g||_1 of the latent-weight gradient, sampled at
    steps 100/500/1000), ternary code-flip rate (100-step windows),
    throughput (tokens/s), peak VRAM"
  - "systems (reported): deployed bytes per arm (packed ternary +
    scales formula), training FLOPs (6 x N x tokens, both arms)"
evidence_categories: [software, representation, downstream, systems]

# ----- thresholds (frozen at PROPOSE) --------------------------------------
pass_thresholds:
  - "hadamard wikitext ppl <= 0.97 x control wikitext ppl"
  - "hadamard arc_easy >= control arc_easy - 0.03 (absolute)"
  - "hadamard lambada_openai >= control lambada_openai - 0.02
    (absolute)"
fail_thresholds:
  - "any pass bar missed -> FAIL; per CP3.2 the Hadamard line closes
    with H-POST (A-RP-HAD -> PROVISIONAL_FAIL path; H-NATIVE verdict
    recorded)."
kill_criteria:
  - "NaN/inf loss in either arm -> arm aborts (INVALID arm);
    rerun."
  - "Zero-gradient abort: conditioning proxy == 0 at the first
    sample -> INVALID (STE defect class)."
  - "Live loss-gap abort: hadamard mean train loss over the last
    200 completed steps (step-aligned) exceeds 1.15 x the control
    arm's over the same window -> hadamard aborts -> FAIL."
  - "Budget overrun: >2 GPU-hours total -> stop; record
    CONTINUE/INVALID per OPERATING-PLAN §4, never silent extension."
  - "Environment drift mid-run (GPU reallocation, cache
    modification, library change) -> INVALID."
budget: "512k tokens per arm (1000 steps x 512 tokens); 2 GPU-hours
  cap; ~30 min per arm expected on TITAN RTX; both arms run in
  parallel on cuda:0/cuda:1.
  PRE-RUN AMENDMENT 2026-08-30 (no results read): the from-scratch
  budget (200M tokens/arm) was superseded by the pretrained-start
  design revision (prior_runs run 3): PTQ-init training uses the
  AF-proven short budget (1000 steps). Both arms matched; bars,
  parity gate, and the remaining kill criteria unchanged.
  Conditioning samples at {100, 500, 1000}."
stop_conditions:
  - "Both arms complete 1000 steps, materialize checkpoints, and
    write eval summaries."
expected_artifacts:
  - "per arm: history.jsonl (step, loss, code-flip, throughput),
    conditioning.json, summary.json, materialized checkpoint
    (save_pretrained), runtime state dict + Q codes, cost_vector.json"
  - "verification: parity-gate measurement + data-prep manifest
    (cache shas)"
  - "audit.json (threshold evaluation) + ARTIFACTS.json +
    provenance.json + env-lock.txt"
artifact_paths:
  - "EXP-A-H1/verdict.md (at DECIDE)"
  - "runs/a/EXP-A-H1/<timestamp>/ (legion, git-ignored: checkpoints,
    histories, eval outputs, ARTIFACTS.json, env-lock, provenance)"
artifacts_manifest: "runs/a/EXP-A-H1/<timestamp>/ARTIFACTS.json"
contamination_risks:
  - "New token caches (/tmp/ah1_owt_*.npy) are GPT-2-tokenized and
    disjoint from every AF cache; prep refuses to overwrite; shas
